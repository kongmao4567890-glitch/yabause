name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Test percentage speed limiter
        run: python3 yabause/src/tests/test_frame_limit.py

      - name: Test OpenGL display filters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri python3-numpy python3-pil
          /usr/bin/python3 yabause/src/tests/test_display_filters.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Create local.properties
        working-directory: yabause/src/android
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Grant execute permission for gradlew
        working-directory: yabause/src/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: yabause/src/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaba-sanshiro-debug-apk
          path: |
            yabause/src/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            yabause/src/android/app/build/reports/
            yabause/src/android/**/build/outputs/logs/
          retention-days: 7
