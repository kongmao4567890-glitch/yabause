name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Test signing key restoration
        run: python3 .github/scripts/test_android_signing.py

      - name: Test RGB sprite priority and transparency
        run: python3 yabause/src/tests/test_vdp1_rgb_metadata.py

      - name: Restore and check fixed APK signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 .github/scripts/android_signing.py prepare

      - name: Test percentage speed limiter
        run: python3 yabause/src/tests/test_frame_limit.py

      - name: Test OpenGL display filters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri python3-numpy python3-pil
          /usr/bin/python3 yabause/src/tests/test_display_filters.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Create local.properties
        working-directory: yabause/src/android
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Grant execute permission for gradlew
        working-directory: yabause/src/android
        run: chmod +x gradlew

      - name: Compile pull request (not distributed)
        if: github.event_name == 'pull_request'
        working-directory: yabause/src/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build APK with fixed signing key
        if: github.event_name != 'pull_request'
        working-directory: yabause/src/android
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
          REQUIRE_STABLE_SIGNING: 'true'
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 ../../../.github/scripts/android_signing.py build

      - name: Verify APK identity and write checksums
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 .github/scripts/android_signing.py verify

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: yaba-sanshiro-debug-apk
          path: |
            yabause/src/android/app/build/outputs/apk/debug/*.apk
            yabause/src/android/app/build/outputs/apk/debug/apk-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -rf "${RUNNER_TEMP}/yabause-signing"

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            yabause/src/android/app/build/reports/
            yabause/src/android/**/build/outputs/logs/
          retention-days: 7
